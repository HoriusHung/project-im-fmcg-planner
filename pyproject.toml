# FMCG Production & Supply Planning Simulator (project "fmcg-planner").
# Approved per Milestone 1 Plan v4.4.2, Phase 0 (Checkpoint 2).
# Data disclaimer: every company, product, material, and supplier is fictional.

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "fmcg-planner"
version = "0.1.0"
description = "Educational FMCG production & supply planning simulator with fictional data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# Direct dependency strategy (v4.4.2, correction 3 of v3): only packages directly imported
# by Milestone 1 code. Streamlit / Plotly / OpenPyXL are NOT declared yet; they enter via
# `uv add` in Milestone 2 when page code lands, after wheel verification on Python 3.14.
dependencies = [
    "pandas>=3",
    "numpy>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.13",
    "mypy>=1",
]

[tool.uv.build-backend]
# Explicit mapping avoids relying on the '-' -> '_' name normalization being implicit.
module-name = "fmcg_planner"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Full security rule group (S) stays active; only the assert rule is relaxed in tests.
select = ["E", "F", "I", "W", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
# Engine-only scope in Milestone 1; python_version targets the CI matrix floor.
files = ["src/fmcg_planner"]
python_version = "3.13"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
# 80% coverage gate (to be raised in later milestones, per approved plan).
addopts = "--cov=fmcg_planner --cov-report=term-missing:skip-covered --cov-fail-under=80"
testpaths = ["tests"]
